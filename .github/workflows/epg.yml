name: Build EPG
on:
  schedule:
    - cron: "10 20 * * *"
    - cron: "0 2,8,14 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python epg.py
      - run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add guide.xml
          git diff --cached --quiet || (git commit -m "Update guide" && git push)
